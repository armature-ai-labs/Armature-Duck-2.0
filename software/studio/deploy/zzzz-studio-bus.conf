# /run/microduck-helper/bus-held present = robotd paused by Studio (servo tuning active). Hand back in Studio or reboot.
# Install to /etc/systemd/system/robotd.service.d/zzzz-studio-bus.conf and run systemctl daemon-reload.
# Uses ConditionPathExists instead of runtime mask because robotd.service lives in /etc/systemd/system.
# Flag lives in /run so reboot automatically clears it and robotd starts normally.
# While held, systemctl start robotd exits 0 with ConditionResult=no (inactive).
[Unit]
ConditionPathExists=!/run/microduck-helper/bus-held

# Uncomment the two lines below and daemon-reload to enable handover marker support in robotd.
# Without a marker file, robotd boots identically to V167.
#[Service]
#Environment=MICRODUCK_HANDOVER_MARKER=/run/microduck-handover/handover.json
